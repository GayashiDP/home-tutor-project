<section class="py-5 bg-white" style="min-height: 70vh;">
    <div class="container" style="max-width: 800px;">
        <div class="text-center section-heading mb-5">
            <h2>Complete Your Payment</h2>
            <p>Secure checkout for your upcoming tutoring session</p>
            <div class="underline-bar"></div>
        </div>

        <div class="row g-4">
            <div class="col-md-5 order-md-2">
                <div class="step-card text-start h-auto">
                    <h5 class="mb-4">Session Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tutor</span>
                        <span class="fw-bold" style="color: var(--dark);">Ms. Priya Fernando</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subject</span>
                        <span class="fw-bold" style="color: var(--dark);">Mathematics</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-muted">Date & Time</span>
                        <span class="fw-bold text-end" style="color: var(--dark);">Oct 24, 2026<br>4:00 PM - 6:00 PM</span>
                    </div>
                    <hr class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">Total Due</span>
                        <span class="fs-4 fw-bold" style="color: var(--primary);">LKR 3,000</span>
                    </div>
                </div>
            </div>

            <div class="col-md-7 order-md-1">
                <div class="tutor-card p-4 h-auto">
                    <form action="paymentServlet" method="POST">
                        <h5 class="mb-4" style="color: var(--dark);">Payment Details</h5>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: var(--gray-600); font-size: 0.9rem;">Select Payment Method</label>
                            <select class="form-select" style="border-color: var(--gray-200);">
                                <option selected>Credit / Debit Card</option>
                                <option value="comb">Commercial Bank Transfer</option>
                                <option value="dialog">Dialog Finance</option>
                                <option value="ntb">Nations Trust Bank</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: var(--gray-600); font-size: 0.9rem;">Cardholder Name</label>
                            <input type="text" class="form-control" placeholder="John Doe" style="border-color: var(--gray-200);">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold" style="color: var(--gray-600); font-size: 0.9rem;">Card Number</label>
                            <input type="text" class="form-control" placeholder="0000 0000 0000 0000" style="border-color: var(--gray-200);">
                        </div>

                        <button type="submit" class="btn btn-green w-100 py-2 fs-6">Pay LKR 3,000 & Confirm Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
