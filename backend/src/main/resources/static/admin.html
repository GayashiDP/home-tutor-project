<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Home Tour Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #22d3ee;
            --dark: #0f172a;
            --dark2: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray2: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--light); }

        /* ── Login Screen ── */
        #loginScreen {
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(ellipse at top, #1e1b4b 0%, var(--dark) 70%);
        }
        #loginScreen .login-card {
            width: 380px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-icon { font-size: 3rem; margin-bottom: 1rem; }
        .login-card h2 { font-size: 1.8rem; margin-bottom: 0.4rem; }
        .login-card p { color: var(--gray); margin-bottom: 2rem; font-size: 0.95rem; }
        .login-card input[type="password"] {
            width: 100%; padding: 0.9rem;
            background: rgba(255,255,255,0.07); border: 1px solid var(--glass-border);
            border-radius: 10px; color: white; font-family: inherit; font-size: 1rem;
            margin-bottom: 1rem; letter-spacing: 3px;
            transition: border-color 0.3s;
        }
        .login-card input[type="password"]:focus { outline: none; border-color: var(--primary); }
        .btn-login {
            width: 100%; padding: 1rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border: none; border-radius: 10px;
            color: white; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: opacity 0.3s;
        }
        .btn-login:hover { opacity: 0.9; }
        #loginError { color: var(--danger); font-size: 0.9rem; margin-top: 0.8rem; display: none; }

        /* ── Dashboard ── */
        #dashboard { display: none; min-height: 100vh; }

        .admin-nav {
            padding: 1.2rem 2rem;
            background: var(--dark2);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-nav .logo { font-size: 1.5rem; font-weight: 800; }
        .admin-nav .logo span { color: var(--accent); }
        .btn-logout {
            padding: 0.5rem 1.2rem;
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--gray2); border-radius: 8px; cursor: pointer;
            font-family: inherit; transition: all 0.3s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        .dashboard-content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

        .admin-header { margin-bottom: 2rem; }
        .admin-header h1 { font-size: 2rem; font-weight: 800; }
        .admin-header p { color: var(--gray); }

        /* Stats bar */
        .admin-stats { display: flex; gap: 1.5rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .admin-stat-card {
            flex: 1; min-width: 150px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 1.5rem;
        }
        .admin-stat-card .stat-val { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
        .admin-stat-card .stat-lbl { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }

        /* Review Item */
        .review-item {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 1.8rem; margin-bottom: 1.5rem;
            transition: box-shadow 0.3s;
        }
        .review-item:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

        .review-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem; }
        .review-item-user { display: flex; align-items: center; gap: 0.8rem; }
        .ri-avatar { font-size: 1.8rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(99,102,241,0.15); border-radius: 10px; border: 1px solid var(--glass-border); }
        .ri-name { font-weight: 700; font-size: 1.05rem; }
        .ri-meta { font-size: 0.8rem; color: var(--gray); }
        .ri-tour { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(34,211,238,0.1); color: var(--accent); border-radius: 6px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(34,211,238,0.2); }
        .ri-rating { color: #fbbf24; font-size: 1.1rem; }
        .ri-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .ri-badge.replied { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
        .ri-badge.pending { background: rgba(234,179,8,0.15); color: #fbbf24; border: 1px solid rgba(234,179,8,0.3); }
        .ri-comment { color: var(--gray2); margin: 1rem 0; line-height: 1.7; }

        /* Reply area */
        .existing-reply {
            padding: 1rem; background: rgba(99,102,241,0.1);
            border-left: 3px solid var(--primary); border-radius: 0 10px 10px 0;
            margin-bottom: 1rem;
        }
        .existing-reply-label { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.3rem; }
        .existing-reply p { font-size: 0.9rem; color: var(--gray2); }

        .reply-form { display: flex; gap: 0.8rem; align-items: stretch; }
        .reply-input {
            flex: 1; padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 10px; color: white; font-family: inherit; font-size: 0.9rem;
            transition: border-color 0.3s;
            resize: none;
        }
        .reply-input:focus { outline: none; border-color: var(--primary); }
        .btn-reply {
            padding: 0.75rem 1.5rem;
            background: var(--primary); border: none; border-radius: 10px;
            color: white; font-weight: 700; cursor: pointer;
            font-family: inherit; white-space: nowrap;
            transition: background 0.3s;
        }
        .btn-reply:hover { background: #4f46e5; }

        .btn-delete {
            padding: 0.4rem 0.9rem;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            color: var(--danger); border-radius: 8px;
            font-size: 0.8rem; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all 0.3s;
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        .action-row { display: flex; justify-content: flex-end; gap: 0.7rem; margin-top: 0.8rem; }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 1000;
            padding: 1rem 1.8rem; background: var(--success);
            color: white; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s;
        }
        .toast.hidden { opacity: 0; transform: translateY(80px); pointer-events: none; }
        .toast.error { background: var(--danger); }

        /* Loader */
        .admin-loader { text-align: center; padding: 4rem; color: var(--gray); }
        .spin { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--glass-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-icon">🔐</div>
            <h2>Admin Access</h2>
            <p>Sign in to manage Home Tour Reviews</p>
            <input type="password" id="adminPassword" placeholder="Enter admin password" autofocus>
            <button class="btn-login" id="loginBtn">Sign In</button>
            <p id="loginError">❌ Incorrect password. Try again.</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <nav class="admin-nav">
            <div class="logo">Home<span>Tour</span> <span style="color:var(--gray); font-size:0.9rem; font-weight:400;">Admin</span></div>
            <div style="display:flex;gap:1rem;align-items:center;">
                <a href="/" style="color:var(--gray2);text-decoration:none;font-size:0.9rem;">← Back to Site</a>
                <button class="btn-logout" id="logoutBtn">Log Out</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="admin-header">
                <h1>Review Management</h1>
                <p>Reply to reviews and manage your community feedback.</p>
            </div>

            <div class="admin-stats" id="adminStats">
                <div class="admin-stat-card"><div class="stat-val" id="adTotalReviews">–</div><div class="stat-lbl">Total Reviews</div></div>
                <div class="admin-stat-card"><div class="stat-val" id="adAvgRating">–</div><div class="stat-lbl">Avg Rating</div></div>
                <div class="admin-stat-card"><div class="stat-val" id="adReplied">–</div><div class="stat-lbl">Replied</div></div>
                <div class="admin-stat-card"><div class="stat-val" id="adPending">–</div><div class="stat-lbl">Pending</div></div>
            </div>

            <div id="adminReviewsList">
                <div class="admin-loader"><div class="spin"></div><p>Loading reviews...</p></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const API = '/api/reviews';
        const FEEDBACK_API = '/api/feedback';

        let repliesMap = {};

        // ── Toast ──
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        // ── Login ──
        document.getElementById('loginBtn').addEventListener('click', () => {
            const pw = document.getElementById('adminPassword').value;
            if (pw === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadReviews();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
        document.getElementById('adminPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        });

        // ── Load Reviews ──
        async function loadReviews() {
            const list = document.getElementById('adminReviewsList');
            list.innerHTML = '<div class="admin-loader"><div class="spin"></div><p>Loading...</p></div>';
            try {
                const res = await fetch(API);
                const reviews = await res.json();

                // Load all replies
                for (const r of reviews) {
                    try {
                        const rRes = await fetch(`${FEEDBACK_API}/review/${r.id}`);
                        repliesMap[r.id] = rRes.ok ? await rRes.json() : [];
                    } catch (_) { repliesMap[r.id] = []; }
                }

                updateAdminStats(reviews);
                renderAdminReviews(reviews);
            } catch (e) {
                list.innerHTML = '<div class="admin-loader"><p style="color:#ef4444">⚠️ Could not load reviews. Is the backend running?</p></div>';
            }
        }

        function updateAdminStats(reviews) {
            document.getElementById('adTotalReviews').textContent = reviews.length;
            const avg = reviews.length ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1) : '0';
            document.getElementById('adAvgRating').textContent = avg + '★';
            const replied = reviews.filter(r => repliesMap[r.id]?.length > 0).length;
            document.getElementById('adReplied').textContent = replied;
            document.getElementById('adPending').textContent = reviews.length - replied;
        }

        function renderAdminReviews(reviews) {
            const list = document.getElementById('adminReviewsList');
            if (!reviews.length) {
                list.innerHTML = '<div class="admin-loader"><p>No reviews yet.</p></div>';
                return;
            }

            list.innerHTML = '';
            reviews.forEach(review => {
                const replies = repliesMap[review.id] || [];
                const isReplied = replies.length > 0;
                const dateStr = review.createdAt ? new Date(review.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric'}) : 'Unknown';

                const item = document.createElement('div');
                item.className = 'review-item';
                item.id = `review-${review.id}`;

                const existingRepliesHtml = replies.map(reply => `
                    <div class="existing-reply">
                        <div class="existing-reply-label">⚙️ ${reply.adminName || 'Admin'}</div>
                        <p>${reply.replyText}</p>
                    </div>
                `).join('');

                item.innerHTML = `
                    <div class="review-item-header">
                        <div class="review-item-user">
                            <div class="ri-avatar">${review.avatarUrl || '🏠'}</div>
                            <div>
                                <div class="ri-name">${review.userName}</div>
                                <div class="ri-meta">${dateStr}</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <span class="ri-tour">🚪 ${review.houseName}</span>
                            <span class="ri-badge ${isReplied ? 'replied' : 'pending'}">${isReplied ? '✅ Replied' : '⏳ Pending'}</span>
                        </div>
                    </div>
                    <div class="ri-rating">${'★'.repeat(review.rating)}<span style="opacity:0.25">${'★'.repeat(5 - review.rating)}</span></div>
                    <p class="ri-comment">"${review.comment}"</p>
                    ${existingRepliesHtml}
                    <div class="reply-form">
                        <textarea class="reply-input" id="replyText-${review.id}" rows="2" placeholder="Type your admin reply here..."></textarea>
                        <button class="btn-reply" onclick="submitReply(${review.id})">Reply</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-delete" onclick="deleteReview(${review.id})">🗑 Delete Review</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // ── Submit Reply ──
        async function submitReply(reviewId) {
            const text = document.getElementById(`replyText-${reviewId}`).value.trim();
            if (!text) { showToast('Please write a reply first.', true); return; }
            try {
                const res = await fetch(FEEDBACK_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reviewId, replyText: text, adminName: 'Admin' })
                });
                if (res.ok) {
                    showToast('✅ Reply posted successfully!');
                    loadReviews();
                } else throw new Error();
            } catch (_) { showToast('❌ Failed to post reply.', true); }
        }

        // ── Delete Review ──
        async function deleteReview(id) {
            if (!confirm('Are you sure you want to delete this review? This cannot be undone.')) return;
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('🗑 Review deleted.');
                    loadReviews();
                } else throw new Error();
            } catch (_) { showToast('❌ Failed to delete review.', true); }
        }
    </script>
</body>
</html>
